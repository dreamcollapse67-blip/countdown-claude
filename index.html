<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTA VI Countdown</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@700;800&display=swap">
<style>
:root{--sky1:#fde2f0;--sky2:#ffd2a8;--text:#2a1237;--muted:#6b4a7a;--card:rgba(255,255,255,.75);--cardb:#ff4f9a;--accent:#e6247a;--accent2:#e0701a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1b0a33;--sky2:#5a1750;--text:#fff4fb;--muted:#e0b8d6;--card:rgba(30,10,50,.68);--cardb:#ff5fa8;--accent:#ff5fa8;--accent2:#ffb04a}}
:root[data-theme="dark"]{--sky1:#1b0a33;--sky2:#5a1750;--text:#fff4fb;--muted:#e0b8d6;--card:rgba(30,10,50,.68);--cardb:#ff5fa8;--accent:#ff5fa8;--accent2:#ffb04a}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
@supports (height:100dvh){html{height:100dvh}}
html,body{margin:0;overflow:hidden;overscroll-behavior:none}
body{height:100%;font-family:'Nunito',system-ui,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%,#ffb347);background-color:var(--sky1)}
.wrap{height:100%;max-width:1100px;margin:0 auto;padding:10px 12px 14px;display:flex;flex-direction:column}
header{text-align:center;flex:none;position:relative;z-index:30}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(2.2rem,6.5dvh,4rem);letter-spacing:.05em;margin:0;line-height:1;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:6px;font-weight:800;font-size:.95rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#0070d1;color:#fff;border-radius:99px;padding:3px 12px 3px 5px;letter-spacing:.06em}
.chip svg{width:22px;height:22px}
.cards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:center;align-items:stretch;padding:10px 0}
.card{display:grid;align-content:center;justify-items:center;text-align:center;gap:6px;min-width:0;padding:12px 8px;background:var(--card);border:2px solid var(--cardb);border-radius:18px;box-shadow:0 6px 22px rgba(230,36,122,.2)}
.fw{position:relative;width:clamp(56px,8dvh,88px)}
.cf{display:block;width:100%;height:auto;border-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.bag{position:absolute;right:-10px;bottom:-10px;width:44%;height:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.nm{font-weight:800;font-size:clamp(1rem,2.6dvh,1.2rem);line-height:1.15}
.when{font-weight:800;font-size:clamp(.9rem,2.2dvh,1.05rem);color:var(--muted)}
.cd{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(1.2rem,min(2.7vw,5.2dvh),2.2rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:nowrap}
.card.done .cd{color:var(--accent2)}
@media (orientation:portrait){
 .cards{display:flex;flex-direction:column;justify-content:safe center;gap:8px;padding:6px 0}
 .card{flex:1 1 0;min-height:0;max-height:24dvh;overflow:hidden;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"f i" "f c";row-gap:2px;justify-items:start;text-align:left;align-items:center;gap:0 16px;padding:8px 16px}
 .fw{grid-area:f;width:clamp(36px,min(16vw,8dvh),80px)}.info{grid-area:i}.cd{grid-area:c}
 .cd{font-size:clamp(1.1rem,min(6.4vw,3.8dvh),2rem);justify-content:flex-start;flex-wrap:nowrap}
 .scene{--rs:0px}
}
.scene{--rs:440px;flex:none;container-type:inline-size;width:min(100%,calc((100dvh - var(--rs)) * 3.14));margin:0 auto;padding-top:56px}
.road{position:relative;--cw:clamp(84px,22cqw,200px);--l0:2cqw;--r0:5cqw;--fw:clamp(36px,12cqw,64px)}
@media (orientation:portrait){.road{--cw:clamp(88px,25cqw,200px)}}
.road>img.bg{display:block;width:100%;height:auto}
.car{position:absolute;bottom:27%;width:var(--cw);left:calc(var(--l0) + (100% - var(--cw) - var(--l0) - var(--r0)) * var(--p,0));transition:left 1s linear;z-index:3;pointer-events:none}
.car img{display:block;width:100%;height:auto;animation:bob .45s ease-in-out infinite alternate;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
@keyframes bob{to{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.car img{animation:none}.car{transition:none}}
.mk{position:absolute;bottom:26%;height:51%;width:8px;margin-left:-8px;left:calc(var(--l0) + (100% - var(--cw) - var(--l0) - var(--r0)) * var(--m) + var(--cw));z-index:2}
.mk::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/8px 8px;transform:skewX(-13.5deg)}
.pole{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:12px}
.pole::after{content:"";position:absolute;top:100%;left:50%;width:3px;height:12px;margin-left:-1.5px;background:#fff;box-shadow:0 0 2px rgba(0,0,0,.5)}
.pole svg{display:block;width:var(--fw);height:auto;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.mk.passed .pole{filter:grayscale(.7);opacity:.65}
.car img.hn{display:none;position:absolute;left:-17%;bottom:1.5%;width:131%;max-width:none;height:auto;animation:shake .08s linear infinite alternate}
.car.honk img.nm,.car.lay img.nm{visibility:hidden}.car.honk img.h1{display:block}.car.lay img.h2{display:block}
@keyframes shake{to{transform:translate(1px,-1px)}}
.sb{flex:none;position:relative;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 28px;border:3px solid #fff;border-radius:99px;font:400 1.6rem 'Bebas Neue',Impact,sans-serif;letter-spacing:.12em;color:#fff;background:linear-gradient(180deg,var(--accent),var(--accent2));box-shadow:0 6px 0 rgba(0,0,0,.25),0 8px 20px rgba(230,36,122,.45);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .08s,box-shadow .08s}
.sb:hover{filter:brightness(1.08)}
.sb:active,.sb.on{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25),0 4px 12px rgba(230,36,122,.45)}
.sb:focus-visible{outline:3px solid #fff;outline-offset:3px}
.sb svg{width:26px;height:26px;fill:currentColor}
.cd{display:flex;flex-wrap:nowrap;justify-content:center;align-items:baseline;gap:0 .45em}.cd .u{white-space:nowrap}.cd .u b{font-weight:400}.cd .u{font-size:.36em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:'Nunito',system-ui,sans-serif;font-weight:800}.cd .u b{font-size:2.8em;line-height:1;color:var(--text);font-family:'Bebas Neue',Impact,sans-serif;margin-right:.2em;letter-spacing:.02em}.card.done .cd{display:block}
#bar{flex:none;display:flex;justify-content:center;align-items:center;gap:10px;margin-top:8px}
@media (orientation:portrait){.sb{padding:10px 14px;font-size:1.15rem;gap:6px;letter-spacing:.08em}.sb svg{width:20px;height:20px}#bar{gap:8px}}
.fx{position:absolute;left:0;right:0;top:-56px;bottom:0;pointer-events:none;overflow:hidden;z-index:4}
.bird,.cloud{position:absolute;left:0;animation:fly var(--d) linear infinite;animation-delay:var(--dl)}
.bird{top:var(--t);width:var(--s);color:var(--text);opacity:.88;animation:fly var(--d) linear infinite,bobb 1.6s ease-in-out infinite alternate;animation-delay:var(--dl),var(--dl)}
.bird svg,.scare svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 70%;animation:flap .36s ease-in-out infinite alternate;animation-delay:var(--fd,0s)}
.bird path,.scare path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bird circle,.scare circle{fill:currentColor}
@keyframes fly{from{transform:translateX(-14cqw)}to{transform:translateX(114cqw)}}
@keyframes bobb{to{translate:0 7px}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.3)}}
.cloud{top:var(--t);width:var(--s);height:calc(var(--s) * .26);border-radius:99px;background:#fff;opacity:.55;filter:blur(1px)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:46%;height:115%;left:14%;bottom:20%}.cloud::after{width:34%;height:95%;left:52%;bottom:20%}
:root[data-theme="dark"] .cloud{opacity:.16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cloud{opacity:.16}}
.bf{position:absolute;left:var(--x);bottom:var(--b);width:var(--s);animation:wander var(--d) ease-in-out infinite alternate;animation-delay:var(--dl)}
.bf svg{display:block;width:100%;height:auto;overflow:visible;animation:wing .2s ease-in-out infinite alternate}
@keyframes wing{from{transform:scaleX(1)}to{transform:scaleX(.3)}}
@keyframes wander{0%{transform:translate(0,0)}22%{transform:translate(4cqw,-3.5cqw)}48%{transform:translate(9cqw,.5cqw)}74%{transform:translate(13cqw,-3cqw)}100%{transform:translate(19cqw,-.5cqw)}}
.scare{position:absolute;left:var(--x);bottom:var(--b);width:3.2cqw;color:var(--text);animation:scare 1.7s ease-out forwards}
@keyframes scare{to{transform:translate(var(--dx),-40cqw);opacity:0}}
@media (prefers-reduced-motion:reduce){.fx{display:none}}
</style>
</head>

const START=Date.parse('2026-11-17T17:00:00Z');
const STORES=[
 {id:'nz',name:'New Zealand Store',at:Date.parse('2026-11-18T11:00:00Z')},
 {id:'sa',name:'Saudi Store',at:Date.parse('2026-11-18T21:00:00Z')},
 {id:'us',name:'USA Store',at:Date.parse('2026-11-19T05:00:00Z')}
];
const END=STORES[STORES.length-1].at;
const fmt=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short',hour:'numeric',minute:'2-digit',hour12:true});
const pad=n=>String(n).padStart(2,'0');
const road=document.getElementById('road');
const flag=id=>`<svg viewBox="0 0 30 20"><use href="#f-${id}"/></svg>`;
document.getElementById('cards').innerHTML=STORES.map(s=>`
 <div class="card" id="c-${s.id}">
  <div class="fw">${flag(s.id).replace('<svg ','<svg class="cf" ')}<svg class="bag" viewBox="0 0 24 24"><use href="#bag"/></svg></div>
  <div class="info"><div class="nm">${s.name}</div><div class="when">${fmt.format(s.at)}</div></div>
  <div class="cd" id="cd-${s.id}"></div>
 </div>`).join('');
STORES.forEach(s=>{
  const m=document.createElement('div');
  m.className='mk';m.id='m-'+s.id;
  m.style.setProperty('--m',(s.at-START)/(END-START));
  m.innerHTML=`<div class="pole">${flag(s.id)}</div>`;
  road.appendChild(m);
});
function tick(){
  const now=Date.now();
  STORES.forEach(s=>{
    const left=s.at-now,card=document.getElementById('c-'+s.id),cd=document.getElementById('cd-'+s.id);
    card.classList.toggle('done',left<=0);
    document.getElementById('m-'+s.id).classList.toggle('passed',left<=0);
    if(left<=0){cd.textContent='OUT NOW!';return}
    const t=Math.floor(left/1000),d=Math.floor(t/86400);
    const h=Math.floor(t%86400/3600),mi=Math.floor(t%3600/60),sc=t%60,u=(n,l)=>`<span class="u"><b>${n}</b>${l}</span>`;cd.innerHTML=(d?u(d,d==1?'day':'days'):'')+(d||h?u(h,h==1?'hr':'hrs'):'')+u(mi,'min')+u(sc,'sec');
  });
  road.style.setProperty('--p',Math.min(1,Math.max(0,(now-START)/(END-START))));
}

laAudio.preload='auto';let laT;
const laOff=()=>{laBtn.classList.remove('on');carEl.classList.remove('lay')};
laAudio.addEventListener('ended',laOff);
laBtn.addEventListener('click',()=>{
  hornAudio.pause();hornOff();
  clearTimeout(laT);laAudio.currentTime=0;laBtn.classList.add('on');
  carEl.classList.add('lay');laT=setTimeout(laOff,15000);
  laAudio.play().catch(laOff);
});
hornBtn.addEventListener('click',()=>{laAudio.pause();laOff()});
const BIRD='<svg viewBox="0 0 30 14"><path d="M1 8Q8 0 15 8Q22 0 29 8"/><circle cx="15" cy="8.5" r="1.7"/></svg>';
const BUTTERFLY=c=>`<svg viewBox="0 0 20 16"><ellipse cx="6" cy="6" rx="6" ry="5" fill="${c[0]}"/><ellipse cx="6.5" cy="11.5" rx="4" ry="3.6" fill="${c[1]}"/><ellipse cx="14" cy="6" rx="6" ry="5" fill="${c[0]}"/><ellipse cx="13.5" cy="11.5" rx="4" ry="3.6" fill="${c[1]}"/><rect x="9.4" y="3" width="1.2" height="10" rx=".6" fill="#2a1237"/></svg>`;
const fx=document.createElement('div');fx.className='fx';
const birds=[[8,6.5,15,-2],[26,5,21,-9],[46,6,18,-14],[16,4.2,26,-18],[62,5.2,23,-6],[36,3.8,30,-24]];
const clouds=[[18,14,70,-20],[24,10,95,-55],[14,8,120,-85]];
const flies=[['6%',5.4,'10%',[['#ff7ab8','#ffd166'],[0]],13,-3],['58%',4.4,'16%',[['#5ad1ff','#b79cff'],[0]],17,-9],['30%',3.8,'7%',[['#ffb04a','#ff5fa8'],[0]],15,-6]];
fx.innerHTML=
 clouds.map(c=>`<div class="cloud" style="--t:${c[0]}px;--s:${c[1]}cqw;--d:${c[2]}s;--dl:${c[3]}s"></div>`).join('')+
 birds.map((b,i)=>`<div class="bird" style="--t:${b[0]}px;--s:${b[1]}cqw;--d:${b[2]}s;--dl:${b[3]}s"><div style="--fd:${-i*.07}s">${BIRD}</div></div>`.replace('<div style="--fd','<div style="display:contents;--fd')).join('')+
 flies.map(b=>`<div class="bf" style="--x:${b[0]};--s:${b[1]}cqw;--b:${b[2]};--d:${b[4]}s;--dl:${b[5]}s">${BUTTERFLY(b[3][0])}</div>`).join('');
road.appendChild(fx);
function scare(){
  for(let i=0;i<6;i++){
    const s=document.createElement('div');s.className='scare';
    s.style.cssText=`--x:${8+Math.random()*80}%;--b:${6+Math.random()*14}%;--dx:${(Math.random()*30-8).toFixed(1)}cqw;animation-delay:${(i*.06).toFixed(2)}s;--fd:${-Math.random()*.3}s`;
    s.innerHTML=BIRD;fx.appendChild(s);setTimeout(()=>s.remove(),2200);
  }
}
[hornBtn,laBtn].forEach(b=>b.addEventListener('click',scare));
tick();setInterval(tick,1000);
</script>
